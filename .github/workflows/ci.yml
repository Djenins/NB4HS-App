name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on any known advisory in the app's npm dependencies, dev tools
      # included. Fix by upgrading; if one truly can't be fixed yet, record it
      # in plans/launch-readiness-2026-10-29.md rather than lowering the level.
      - run: npm audit --audit-level=low
      - run: npm test
      # The build only needs the variables to exist; the real values live in Vercel.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      # Edge Functions run on Deno; their tests use fakes, no network or keys.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-lock supabase/functions
