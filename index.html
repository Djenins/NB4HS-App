<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3">
<title>NB4HS Client Check-In System (Prototype)</title>
<!-- Apply the saved Light/Dark theme before first paint, so a dark-mode
     reload doesn't flash light while React boots. Same key and attribute as
     storage.js's getConfig()/applyTheme(); AppContext takes over after. -->
<script>
try { if ((JSON.parse(localStorage.getItem("nb4hs_checkin_config_v1")) || {}).theme === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
</script>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
